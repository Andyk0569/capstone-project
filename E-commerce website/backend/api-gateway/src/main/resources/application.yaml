server:
  port: 8080

spring:
  application:
    name: api-gateway

# JWT Configuration - MUST MATCH ecommerce (user-service)
jwt:
  secret: u9s8Df7G6h5J4k3L2p1QwErTyUiOpAsDfGhJkLzXcVbNm1234
  expiration-ms: 86400000

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs
